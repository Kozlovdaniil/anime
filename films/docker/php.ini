; Настройки PHP для приложения.
;
; memory_limit: полный обход каталога amd:sync парсит много HTML-страниц и без
; запаса упирается в дефолтные 128M. Держим лимит НИЖЕ mem_limit контейнера
; (1g в docker-compose.yml), чтобы при нехватке памяти PHP падал с понятной
; ошибкой, а не убивался OOM-killer'ом. Если полный парсинг всё же упирается —
; поднимите оба значения (здесь и mem_limit у сервиса app).
memory_limit = 768M
